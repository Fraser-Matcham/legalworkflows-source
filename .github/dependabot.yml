# Dependabot automatically opens PRs to keep dependencies patched.
#
# This pairs with .github/workflows/security.yml: that workflow FAILS the
# build when a high/critical advisory is published against a locked
# dependency; Dependabot is the bot that FIXES it — it watches the GitHub
# Advisory Database and opens a PR bumping the affected package to the
# patched version, usually within hours of the CVE landing. Review, check
# CI is green, merge: the gate is green again without anyone running
# `npm audit fix` by hand.
#
# One repo setting is needed for the CVE-fix PRs (this file alone only
# schedules version bumps): Settings → Advanced Security →
# "Dependabot security updates" → Enable. It's free for public repos.
#
# Dependabot never pushes directly — everything arrives as a PR that CI
# (including the audit gate and test suites) runs against first.

version: 2
updates:
  # Repo root — Playwright e2e tooling with its own package-lock.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      dev-dependencies:
        applies-to: version-updates
        dependency-type: "development"
      production-dependencies:
        applies-to: version-updates
        dependency-type: "production"

  # Backend workspace
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Majors that take a whole grouped update down with them. Without these,
    # one incompatible package blocks fifteen routine bumps every week and the
    # group is never mergeable. Ignoring only the MAJOR means patches and
    # minors still flow, and the major arrives as its own reviewable pull
    # request instead. Remove an entry once its migration has landed.
    ignore:
      # Express 5 widens req.params to `string | string[]` and changes async
      # error propagation, route-pattern syntax and req.body defaults. See
      # docs/delivery-plan/dependency-upgrade-plan.md.
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per batch of CVE fixes instead of one PR per advisory
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      # Routine version bumps arrive as (at most) two grouped weekly PRs —
      # one for dev deps, one for production deps — never as a flood of
      # per-package PRs.
      dev-dependencies:
        applies-to: version-updates
        dependency-type: "development"
      production-dependencies:
        applies-to: version-updates
        dependency-type: "production"

  # Frontend workspace
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # pdfjs-dist 4 -> 6 must move in lockstep with STANDARD_FONT_DATA_URL in
      # highlightQuote.ts, which pins the version into a CDN path.
      - dependency-name: "pdfjs-dist"
        update-types: ["version-update:semver-major"]
      # eslint 10 is blocked upstream: typescript-eslint refuses to load
      # against this repo's TypeScript 7. Nothing to fix on this side.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      dev-dependencies:
        applies-to: version-updates
        dependency-type: "development"
      production-dependencies:
        applies-to: version-updates
        dependency-type: "production"

  # Word add-in — its own lockfile, its own CI job (.github/workflows/
  # word-addin.yml), and its own advisory surface
  - package-ecosystem: "npm"
    directory: "/word-addin"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # office-addin-debugging 6 replaces @microsoft/teamsapp-cli with
      # @microsoft/m365agentstoolkit-cli and drags ~200 transitive changes
      # (inquirer 7->12, glob 7->13, msal 2->5) into what reads as a
      # three-package security patch. It is a toolchain migration and wants
      # its own change.
      - dependency-name: "office-addin-debugging"
        update-types: ["version-update:semver-major"]
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      dev-dependencies:
        applies-to: version-updates
        dependency-type: "development"
      production-dependencies:
        applies-to: version-updates
        dependency-type: "production"

  # Keep the actions used by the security workflow pinned and current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
