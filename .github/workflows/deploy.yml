# Release pipeline: a merge to main becomes the running production service.
#
#   config ──▶ gate ──▶ mirror ──▶ build (backend, frontend) ──▶ migrate ──▶ backend ──▶ frontend ──▶ summary
#
# The order is the point (docs/release-pipeline.md explains each step):
#
#   config   reads the deployment settings, and is the only place that
#            decides whether there is anywhere to deploy to;
#   gate     nothing deploys unless every CI check on this exact commit is
#            green (ticket 2052);
#   mirror   the Corresponding Source is published BEFORE anything runs, so a
#            running version never lacks published source (AGPL section 13;
#            tickets 2074, 2075) — if the push fails, the deploy stops here;
#   build    both images, pushed to ECR under the commit sha, scanned, and
#            refused on a high or critical finding (ticket 2050);
#   migrate  every migration newer than the recorded one, once (ticket 2051);
#   backend  a new task definition revision; the catalogue-sync release job
#            runs from it first; then the service rolls and must pass /ready;
#   frontend the same, gated on the home page answering.
#
# Nothing here runs Terraform: infra/ is applied by a person (infra/README.md).
# Rolling back is .github/workflows/rollback.yml with the revisions the
# summary of the previous run recorded.
#
# Configuration (Stage 4, Task 1 in docs/delivery-plan/v2/human-tasks/):
#   variables  AWS_REGION, AWS_ROLE_ARN, AWS_ACCOUNT_ID, APP_URL,
#              SOURCE_MIRROR_REPOSITORY (owner/repo of the public mirror)
#   secrets    SUPABASE_DB_URL (session-pooler connection string),
#              SOURCE_MIRROR_TOKEN (fine-grained PAT: contents write on the
#              mirror only)
#   stage 5    PLATFORM_ENABLED=true once infra's platform_enabled is applied
#   variables  (builds the dbtools image); PLATFORM_SERVES_BACKEND=true once
#              platform_serves_backend is applied (migrations run as a task
#              inside the VPC instead of over SUPABASE_DB_URL)
#
# Either scope works: repository, or the `production` environment. Which one
# is used is invisible here because nothing below reads a variable outside a
# job that has resolved the environment — see the `config` job.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and a queued one waits rather than cancelling: a
# cancelled deploy mid-rollout is the one state nobody wants to reason about.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write # the release tag
  id-token: write # AWS via OIDC
  checks: read # the gate reads this commit's check runs
  actions: read

# Only what is constant. A workflow-level `env` is evaluated without a job's
# environment resolved, so anything fed by a variable is read by `config`
# instead and reaches the jobs that need it as an output.
env:
  NAME_PREFIX: legalworkflows-production

jobs:
  # Where the deployment settings are read, and the only place that decides
  # whether there is anywhere to deploy to.
  #
  # It declares `environment: production`, and that is the whole point. A
  # job-level `if: vars.AWS_ROLE_ARN != ''` sees only repository- and
  # organisation-scoped variables, because GitHub evaluates `if` before it
  # resolves the job's environment. A repository whose values live on the
  # `production` environment — the natural place for them, given four jobs
  # below name it — then looks exactly like a repository with nothing
  # configured at all, and every deploy job skips in silence. Reading them
  # here works whichever scope they were added at.
  #
  # Values other jobs need travel from here as outputs rather than being
  # re-read from `vars`, so there is one answer per run to what is configured.
  # Secrets never travel that way: a job that needs one names the environment.
  #
  # Skipping rather than failing when nothing is set keeps a merge to main
  # from producing a red run and an email while the footprint is still being
  # built. Once AWS_ROLE_ARN exists, everything below is strict.
  config:
    name: Read the deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    outputs:
      configured: ${{ steps.read.outputs.configured }}
      mirror_repository: ${{ steps.read.outputs.mirror_repository }}
      ecr_registry: ${{ steps.read.outputs.ecr_registry }}
    steps:
      - id: read
        env:
          IN_AWS_REGION: ${{ vars.AWS_REGION }}
          IN_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          IN_AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          IN_APP_URL: ${{ vars.APP_URL }}
          IN_SOURCE_MIRROR_REPOSITORY: ${{ vars.SOURCE_MIRROR_REPOSITORY }}
          SET_SOURCE_MIRROR_TOKEN: ${{ secrets.SOURCE_MIRROR_TOKEN != '' }}
          SET_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
        run: |
          set -u

          if [ -n "$IN_AWS_ROLE_ARN" ]; then
            {
              echo "configured=true"
              echo "mirror_repository=$IN_SOURCE_MIRROR_REPOSITORY"
              echo "ecr_registry=${IN_AWS_ACCOUNT_ID}.dkr.ecr.${IN_AWS_REGION}.amazonaws.com"
            } >> "$GITHUB_OUTPUT"
            echo "deploying to $IN_AWS_ACCOUNT_ID in $IN_AWS_REGION"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"

          # Names and set/unset only, never values. Without this, a missing
          # setting and a setting this run cannot read look identical.
          {
            echo "## Not deployed: the pipeline is not configured yet"
            echo
            echo "\`AWS_ROLE_ARN\` is empty, so every deploy job was skipped. This job reads"
            echo "the settings with the \`production\` environment resolved, so it sees the"
            echo "repository, organisation and environment scopes alike."
            echo
            echo "| Setting | Kind | Seen |"
            echo "| --- | --- | --- |"
            for name in AWS_REGION AWS_ACCOUNT_ID AWS_ROLE_ARN APP_URL SOURCE_MIRROR_REPOSITORY; do
              ref="IN_$name"
              [ -n "${!ref}" ] && seen="yes" || seen="NO"
              echo "| \`$name\` | variable | $seen |"
            done
            for name in SUPABASE_DB_URL SOURCE_MIRROR_TOKEN; do
              ref="SET_$name"
              [ "${!ref}" = "true" ] && seen="yes" || seen="NO"
              echo "| \`$name\` | secret | $seen |"
            done
            echo
            echo "Every row NO, with values on the settings page, means they are scoped"
            echo "where even this job cannot read them: an organisation that has not"
            echo "granted this repository access, or a different repository from the one"
            echo "that ran."
            echo
            echo "See docs/delivery-plan/v2/human-tasks/stage-4-launch.md, Task 1."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::AWS_ROLE_ARN is empty, so nothing was deployed. The run summary lists which settings this run could see."

  # ---------------------------------------------------------------------------
  gate:
    name: Wait for CI on this commit
    needs: config
    if: needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest
      # Its own deadline is 45 minutes (below); this is the backstop for a
      # poll that never reaches it.
    timeout-minutes: 50
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: |
          SHA="${GITHUB_SHA}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "tag=deploy-$(date -u +%Y%m%dT%H%M%SZ)-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Every check suite on this commit except our own must have finished
      # green. A failed or cancelled check anywhere stops the deploy; a check
      # still running is waited for, up to 45 minutes. This is what makes a
      # merge to main deploy "with no manual step" without letting a red
      # commit through.
      - name: Every other check on this commit is green
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const deadline = Date.now() + 45 * 60 * 1000;
            // Every job of this workflow run is itself a check run on the
            // commit, queued from the moment the run starts. They must be
            // excluded — by id, and by name in case an earlier Deploy run on
            // the same commit is still around — or the gate would wait on its
            // own downstream jobs until the deadline.
            const ourJobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100,
            });
            const ourIds = new Set(ourJobs.map(j => j.id));
            const ourNames = new Set(ourJobs.map(j => j.name));
            for (;;) {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100,
              });
              const others = runs.filter(r => !ourIds.has(r.id) && !ourNames.has(r.name));
              if (others.length === 0) {
                core.setFailed(`No check runs found on ${sha}. CI has not started; refusing to deploy an unverified commit.`);
                return;
              }
              const bad = others.filter(r => r.status === 'completed' && !['success', 'neutral', 'skipped'].includes(r.conclusion));
              if (bad.length) {
                core.setFailed(`Red on ${sha}: ${bad.map(r => `${r.name} (${r.conclusion})`).join(', ')}`);
                return;
              }
              const pending = others.filter(r => r.status !== 'completed');
              if (pending.length === 0) {
                core.info(`All ${others.length} checks green on ${sha}.`);
                return;
              }
              if (Date.now() > deadline) {
                core.setFailed(`Still waiting on: ${pending.map(r => r.name).join(', ')}`);
                return;
              }
              core.info(`Waiting on ${pending.length}: ${pending.map(r => r.name).join(', ')}`);
              await new Promise(r => setTimeout(r, 30000));
            }

  # ---------------------------------------------------------------------------
  mirror:
    name: Publish the Corresponding Source
    needs: gate
    runs-on: ubuntu-latest
      # A full history push to the mirror, which is slow the first time.
    timeout-minutes: 20
    # SOURCE_MIRROR_REPOSITORY and SOURCE_MIRROR_TOKEN are read below; without
    # this line they are invisible when they are scoped to the environment.
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the mirror receives the full history
          # Leave no credential in the repository's git config. Otherwise
          # checkout persists one that is sent with every request to
          # github.com, and it takes precedence over credentials embedded in a
          # push URL: the mirror push then authenticates as github-actions[bot],
          # which has no access to the mirror, and is refused with a 403 while
          # SOURCE_MIRROR_TOKEN sits unused. Both pushes below carry their own
          # credential explicitly instead.
          persist-credentials: false

      - name: The mirror is configured
        run: |
          if [ -z "${{ vars.SOURCE_MIRROR_REPOSITORY }}" ] || [ -z "${{ secrets.SOURCE_MIRROR_TOKEN }}" ]; then
            echo "::error::SOURCE_MIRROR_REPOSITORY (variable) and SOURCE_MIRROR_TOKEN (secret) must be set. The deploy is blocked until the Corresponding Source can be published — AGPL-3.0 section 13; Stage 4, Tasks 1 and 3."
            exit 1
          fi

      # The exact tree that is about to run, with its history, to the public
      # repository. Fast-forward only: a mirror that has diverged has been
      # written to by hand, and that needs a person to look, not a force push.
      #
      # The tag is created here but published to origin only after this
      # succeeds, so a failed publish leaves no tag behind naming a release
      # that never happened.
      - name: Push to the public mirror
        env:
          MIRROR: ${{ vars.SOURCE_MIRROR_REPOSITORY }}
          TOKEN: ${{ secrets.SOURCE_MIRROR_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          git tag "$TAG" "$SHA"
          git push "https://x-access-token:${TOKEN}@github.com/${MIRROR}.git" \
            "${SHA}:refs/heads/main" \
            "refs/tags/${TAG}:refs/tags/${TAG}"
          echo "Corresponding Source: https://github.com/${MIRROR}/tree/${SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${TAG}"

  # ---------------------------------------------------------------------------
  build:
    name: Build and scan (${{ matrix.service }})
    needs: [config, gate, mirror]
    runs-on: ubuntu-latest
      # Backend builds in well under a minute. A frontend build that passes
      # 30 is not slow, it is stuck — and without this the default is six
      # hours of a held pipeline.
    timeout-minutes: 30
    environment: production
    env:
      ECR_REGISTRY: ${{ needs.config.outputs.ecr_registry }}
    strategy:
      fail-fast: true
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      # The identity this job is about to present to AWS, before it tries.
      #
      # `Not authorized to perform sts:AssumeRoleWithWebIdentity` names
      # neither what was sent nor what was expected, and the two sides live in
      # different systems: the subject below is minted by GitHub from the
      # environment's *recorded* name, while the trust policy is whatever
      # Terraform last applied. They are compared case-sensitively, so a
      # single capital letter parts them while every other symptom looks
      # healthy — the job's variables and secrets still resolve, because the
      # environment itself matches case-insensitively.
      #
      # Only the claims are printed, never the token. A subject identifies;
      # it does not authorise.
      - name: The OIDC subject this job presents
        run: |
          set -euo pipefail
          token=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          # base64url -> base64, and restore the padding a JWT omits: without
          # this, a payload whose length is not a multiple of four decodes to
          # nothing and the diagnostic silently prints an error instead.
          body=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#body} % 4 )) in
            2) body="${body}==" ;;
            3) body="${body}=" ;;
          esac
          printf '%s' "$body" | base64 -d \
            | jq '{sub, aud, repository, environment, ref, job_workflow_ref}'
          echo "Compare sub with: terraform output deploy_allowed_subjects"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # Build-time values for the frontend only. NEXT_PUBLIC_* is inlined into
      # the browser bundle by `next build`, so these are what the site shows;
      # the source URL is the AGPL offer at exactly this commit (ticket 2076).
      - name: Build arguments
        id: args
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            {
              echo "args<<EOF"
              echo "NEXT_PUBLIC_APP_URL=${{ vars.APP_URL }}"
              echo "NEXT_PUBLIC_SOURCE_URL=https://github.com/${{ vars.SOURCE_MIRROR_REPOSITORY }}/tree/${{ needs.gate.outputs.sha }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            printf 'args=\n' >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.NAME_PREFIX }}-${{ matrix.service }}:${{ needs.gate.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.NAME_PREFIX }}-${{ matrix.service }}:main
          build-args: ${{ steps.args.outputs.args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      # Amazon Inspector scans the image (infra/scanning.tf) and the deploy
      # refuses it on any high or critical finding THAT HAS A FIX (ticket 2050).
      #
      # "That has a fix" is the whole design. Basic scanning could not say, so
      # the gate had to be zero-high-or-critical, and a Debian base ships with
      # CVEs Debian has marked will-not-fix — which made the gate unpassable
      # rather than strict, and a gate that can never pass is not a gate. The
      # first image through it carried 5 critical and 24 high, none of which
      # any change to this repository could have cleared.
      #
      # Enhanced findings carry fixAvailable, so the gate now refuses exactly
      # what someone could act on: rebuild, bump a dependency, change a base
      # image. Findings with no fix are printed and counted, never hidden —
      # they are for the security review (plan row 4.12) to weigh, not for a
      # release to silently pass over.
      - name: Image scan is clean of fixable high and critical findings
        run: |
          set -euo pipefail
          REPO="$NAME_PREFIX-${{ matrix.service }}"
          TAG="${{ needs.gate.outputs.sha }}"

          # `aws ecr wait image-scan-complete` waits for COMPLETE, which is a
          # basic-scanning status. Enhanced scanning reports ACTIVE once
          # Inspector has findings for the image and keeps it there while it
          # re-scans, so that waiter would never return. Poll for either.
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            status=$(aws ecr describe-image-scan-findings \
              --repository-name "$REPO" --image-id imageTag="$TAG" \
              --query 'imageScanStatus.status' --output text 2>/dev/null || echo PENDING)
            case "$status" in
              ACTIVE|COMPLETE) break ;;
              FAILED|UNSUPPORTED_IMAGE)
                echo "::error::Inspector reported $status for $REPO:$TAG. An unsupported base image cannot be gated on; see infra/scanning.tf."
                exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Inspector had not scanned $REPO:$TAG after 15 minutes (last status: $status). Enhanced scanning can lag for a few minutes after it is first enabled; re-running this job is safe."
              exit 1
            fi
            echo "scan status: $status — waiting"
            sleep 15
          done

          aws ecr describe-image-scan-findings --repository-name "$REPO" \
            --image-id imageTag="$TAG" --output json > /tmp/scan.json

          echo "all findings by severity: $(jq -c '.imageScanFindings.findingSeverityCounts // {}' /tmp/scan.json)"

          # scripts/check-image-scan.mjs holds the judgement: which findings are
          # actionable here, which are vendored inside the base image and carry a
          # dated allowlist entry, and — the case that hid the gate being inert —
          # whether this is an ENHANCED scan at all.
          node scripts/check-image-scan.mjs --scan /tmp/scan.json --image "$REPO:$TAG"

  # ---------------------------------------------------------------------------
  # Stage 5 (ticket 2113): the database-tools image — psql, pg_dump and
  # pg_restore with this commit's schema and migrations — built when the
  # platform exists. The PLATFORM_ENABLED variable is the operator saying so
  # (the ECR repository only exists once infra's platform_enabled is
  # applied). Same build and scan gate as the services; the context is the
  # repository root because the image carries backend/ files.
  build-dbtools:
    name: Build and scan (dbtools)
    if: vars.PLATFORM_ENABLED == 'true'
    needs: [config, gate, mirror]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      ECR_REGISTRY: ${{ needs.config.outputs.ecr_registry }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/dbtools/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.NAME_PREFIX }}-dbtools:${{ needs.gate.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.NAME_PREFIX }}-dbtools:main
          cache-from: type=gha,scope=dbtools
          cache-to: type=gha,scope=dbtools,mode=max

      # The same gate as the services' images (see the build job for why
      # "fixable" is the line): a tools image with a fixable critical is as
      # much a release blocker as the backend's.
      - name: Image scan is clean of fixable high and critical findings
        run: |
          set -euo pipefail
          REPO="$NAME_PREFIX-dbtools"
          TAG="${{ needs.gate.outputs.sha }}"
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            status=$(aws ecr describe-image-scan-findings \
              --repository-name "$REPO" --image-id imageTag="$TAG" \
              --query 'imageScanStatus.status' --output text 2>/dev/null || echo PENDING)
            case "$status" in
              ACTIVE|COMPLETE) break ;;
              FAILED|UNSUPPORTED_IMAGE)
                echo "::error::Inspector reported $status for $REPO:$TAG."; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Inspector had not scanned $REPO:$TAG after 15 minutes (last status: $status)."; exit 1
            fi
            echo "scan status: $status — waiting"; sleep 15
          done
          aws ecr describe-image-scan-findings --repository-name "$REPO" \
            --image-id imageTag="$TAG" --output json > /tmp/scan.json
          echo "all findings by severity: $(jq -c '.imageScanFindings.findingSeverityCounts // {}' /tmp/scan.json)"
          node scripts/check-image-scan.mjs --scan /tmp/scan.json --image "$REPO:$TAG"

  # ---------------------------------------------------------------------------
  migrate:
    name: Apply database migrations
    # build-dbtools is skipped until the platform exists; a skipped need
    # would skip this job too without the explicit condition.
    needs: [gate, build, build-dbtools]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.build.result == 'success' && (needs.build-dbtools.result == 'success' || needs.build-dbtools.result == 'skipped') }}
    runs-on: ubuntu-latest
      # Safe to cut: the advisory lock is session-level and releases when psql
      # disconnects, each file keeps its own transaction semantics, and the
      # step is already written to leave an accurate record if it stops midway.
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # docs/deployment.md: apply, in filename order, only the files newer
      # than the last one applied, and keep that filename with the deployment
      # records. The record is an SSM parameter the deploy module creates
      # (infra/modules/deploy/README.md). All files run in ONE psql session
      # behind a session-level advisory lock, so two migrators cannot
      # interleave even if the workflow concurrency group were bypassed; each
      # file keeps its own transaction semantics (several manage their own
      # BEGIN/COMMIT), and ON_ERROR_STOP halts at the first failing statement
      # with the record still pointing at the last file that completed.
      # Stage 5, after the cutover (ticket 2122): the database is the RDS
      # instance, reachable from inside the VPC only, so the same procedure
      # runs as a one-off dbtools task — `dbtools migrate`, the same files,
      # the same advisory lock, the same SSM record (infra/dbtools/dbtools.sh).
      # PLATFORM_SERVES_BACKEND is the operator saying infra's
      # platform_serves_backend is applied; until then the psql path below
      # still reaches Supabase.
      - name: Apply migrations newer than the recorded one (dbtools task)
        if: vars.PLATFORM_SERVES_BACKEND == 'true'
        run: |
          set -euo pipefail
          SUBNETS=$(aws ecs describe-services --cluster "$NAME_PREFIX" --services "$NAME_PREFIX-backend" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets' --output json)
          SG=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=$NAME_PREFIX-dbtools" \
            --query 'SecurityGroups[0].GroupId' --output text)
          TASK=$(aws ecs run-task --cluster "$NAME_PREFIX" --launch-type FARGATE \
            --task-definition "$NAME_PREFIX-dbtools" \
            --network-configuration "{\"awsvpcConfiguration\":{\"subnets\":$SUBNETS,\"securityGroups\":[\"$SG\"],\"assignPublicIp\":\"DISABLED\"}}" \
            --overrides '{"containerOverrides":[{"name":"dbtools","command":["migrate"]}]}' \
            --started-by "deploy-${{ needs.gate.outputs.sha }}" \
            --query 'tasks[0].taskArn' --output text)
          echo "migrate task: $TASK"
          aws ecs wait tasks-stopped --cluster "$NAME_PREFIX" --tasks "$TASK"
          EXIT=$(aws ecs describe-tasks --cluster "$NAME_PREFIX" --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          STREAM="dbtools/dbtools/${TASK##*/}"
          for attempt in 1 2 3 4 5; do
            LINES=$(aws logs get-log-events --log-group-name "/ecs/$NAME_PREFIX-dbtools" \
              --log-stream-name "$STREAM" --start-from-head \
              --query 'events[].message' --output text 2>/dev/null || true)
            [ -n "$LINES" ] && break
            sleep 3
          done
          printf '%s\n' "${LINES:-(no log events yet — read them at /ecs/$NAME_PREFIX-dbtools, stream $STREAM)}"
          if [ "$EXIT" != "0" ]; then
            echo "::error::The migrate task exited $EXIT. Its output is above. See docs/runbooks/failed-migration.md."
            exit 1
          fi
          grep -o 'applied through [^ ]*\|nothing to apply' <<<"$LINES" | tail -1 | sed 's/^/migrations: /' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations newer than the recorded one
        if: vars.PLATFORM_SERVES_BACKEND != 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PARAM: /legalworkflows-production/deploy/last-migration
        run: |
          set -euo pipefail
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set (Stage 4, Task 1)."; exit 1
          fi
          LAST=$(aws ssm get-parameter --name "$PARAM" --query 'Parameter.Value' --output text)
          echo "last applied: $LAST"
          mapfile -t PENDING < <(cd backend/migrations && ls -1 *.sql | LC_ALL=C sort | awk -v last="$LAST" '$0 > last')
          if [ "${#PENDING[@]}" -eq 0 ]; then
            echo "nothing to apply" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          printf 'applying %d migration(s):\n' "${#PENDING[@]}"; printf '  %s\n' "${PENDING[@]}"
          ARGS=(-X -v ON_ERROR_STOP=1 -c "select pg_advisory_lock(726400101)")
          for f in "${PENDING[@]}"; do
            ARGS+=(-c "\\echo -- applying $f" -f "backend/migrations/$f" -c "select set_config('legalworkflows.last_migration', '$f', false)")
          done
          # Each completed file is recorded as it completes, so a failure
          # midway leaves the record accurate: psql prints the marker line
          # before each file and we take the last one that was followed by success.
          if psql "$DB_URL" "${ARGS[@]}" 2>&1 | tee /tmp/migrate.log; then
            NEWEST="${PENDING[-1]}"
          else
            APPLIED=$(grep -o 'applying [^ ]*\.sql' /tmp/migrate.log | tail -1 | awk '{print $2}' || true)
            # The file named last in the log is the one that failed; the one
            # before it is the last that completed.
            IDX=-1; for i in "${!PENDING[@]}"; do [ "${PENDING[$i]}" = "$APPLIED" ] && IDX=$i; done
            if [ "$IDX" -gt 0 ]; then
              aws ssm put-parameter --name "$PARAM" --type String --overwrite --value "${PENDING[$((IDX-1))]}" >/dev/null
              echo "::error::Migration $APPLIED failed; record advanced to ${PENDING[$((IDX-1))]}. See docs/runbooks/failed-migration.md."
            else
              echo "::error::Migration $APPLIED failed; no earlier pending file completed, record unchanged. See docs/runbooks/failed-migration.md."
            fi
            exit 1
          fi
          aws ssm put-parameter --name "$PARAM" --type String --overwrite --value "$NEWEST" >/dev/null
          echo "migrations applied through $NEWEST" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  backend:
    name: Deploy the backend
    needs: [config, gate, migrate]
    # Explicit because `migrate` runs past a skipped `build-dbtools`, and the
    # implicit `success()` is false once anything upstream in the graph was
    # skipped — even though every job named here succeeded. Without this the
    # job skips, the two below it skip, and the run still reports success:
    # three deploys went green in a row having deployed nothing.
    # scripts/check-release-pipeline.mjs holds the line.
    if: ${{ !cancelled() && needs.config.result == 'success' && needs.gate.result == 'success' && needs.migrate.result == 'success' }}
    runs-on: ubuntu-latest
      # `ecs wait services-stable` bounds itself at 10 minutes, `tasks-stopped`
      # at 10, and the /api/ready poll at 3.
    timeout-minutes: 30
    environment: production
    env:
      ECR_REGISTRY: ${{ needs.config.outputs.ecr_registry }}
    outputs:
      revision: ${{ steps.register.outputs.revision }}
      catalogue: ${{ steps.sync.outputs.catalogue }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The new revision is the current one with the image swapped and the
      # error tracker's release stamp set to this commit. Everything else —
      # cpu, memory, environment, secrets — stays what Terraform last set.
      - name: Register the task definition revision
        id: register
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$NAME_PREFIX-backend:${{ needs.gate.outputs.sha }}"
          aws ecs describe-task-definition --task-definition "$NAME_PREFIX-backend" --include TAGS > /tmp/current.json
          jq --arg image "$IMAGE" --arg sha "${{ needs.gate.outputs.sha }}" '
            .taskDefinition
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
            | .containerDefinitions[0].image = $image
            | .containerDefinitions[0].environment |= map(if .name == "ERROR_TRACKING_RELEASE" then .value = $sha else . end)
          ' /tmp/current.json > /tmp/next.json
          jq '.tags // []' /tmp/current.json > /tmp/tags.json
          ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/next.json --tags file:///tmp/tags.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "registered $ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "revision=${ARN##*:}" >> "$GITHUB_OUTPUT"

      # docs/deployment.md: run the catalogue sync from the built artifact as
      # a release job, before traffic reaches the new backend. A one-off task
      # from the new revision, in the same subnets and security group as the
      # service, with the command overridden. Its exit code is the verdict.
      - name: Run the workflow catalogue sync from the new revision
        id: sync
        run: |
          set -euo pipefail
          NETCFG=$(aws ecs describe-services --cluster "$NAME_PREFIX" --services "$NAME_PREFIX-backend" \
            --query 'services[0].networkConfiguration' --output json)
          TASK=$(aws ecs run-task --cluster "$NAME_PREFIX" --launch-type FARGATE \
            --task-definition "${{ steps.register.outputs.arn }}" \
            --network-configuration "$NETCFG" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["node","dist/jobs/syncWorkflows.js"]}]}' \
            --started-by "deploy-${{ needs.gate.outputs.short_sha }}" \
            --query 'tasks[0].taskArn' --output text)
          echo "sync task: $TASK"
          aws ecs wait tasks-stopped --cluster "$NAME_PREFIX" --tasks "$TASK"
          EXIT=$(aws ecs describe-tasks --cluster "$NAME_PREFIX" --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$NAME_PREFIX" --tasks "$TASK" --query 'tasks[0].stoppedReason' --output text)
          echo "exit code: $EXIT ($REASON)"
          # 78 (sysexits EX_CONFIG) is the job saying this deployment has no
          # catalogue — MIKE_WORKFLOWS_REPOSITORY is empty. That is a skip, not
          # a failed release: see backend/src/lib/workflowCatalogueConfig.ts.
          # Opting out is explicit, so an unset variable still falls back to the
          # upstream default and still fails here if it cannot be read.
          if [ "$EXIT" = "78" ]; then
            echo "::notice::No workflow catalogue is configured, so the sync was skipped. The release continues. See docs/deployment.md to configure one."
            SYNCED="skipped (no catalogue configured)"
          elif [ "$EXIT" != "0" ]; then
            # Print the task's own output rather than only saying where it
            # lives. The role already holds logs:GetLogEvents on this group
            # (infra/modules/deploy/policy.tf, ReadServiceLogs), so a failed
            # release does not need a second trip to CloudWatch to find out
            # what it said. The awslogs driver can lag the task's stop by a
            # second or two, hence the retry.
            #
            # What lands here is redacted: every console.error in the service
            # goes through the error-tracking bridge, which reduces what it
            # prints with safeErrorForLog — a provider error's request body
            # and any secret-shaped string are dropped before stdout. That is
            # what makes it safe to copy into a CI log anyone with read access
            # can open.
            STREAM="backend/backend/${TASK##*/}"
            echo "--- last 100 lines of $STREAM ---"
            for attempt in 1 2 3; do
              LINES=$(aws logs get-log-events \
                --log-group-name "/ecs/$NAME_PREFIX-backend" \
                --log-stream-name "$STREAM" \
                --limit 100 --start-from-head \
                --query 'events[].message' --output text 2>/dev/null || true)
              [ -n "$LINES" ] && break
              sleep 3
            done
            if [ -n "$LINES" ]; then
              printf '%s\n' "$LINES"
            else
              echo "(no log events yet — read them at /ecs/$NAME_PREFIX-backend, stream $STREAM)"
            fi
            echo "--- end of task output ---"
            # The output names the cause; this points at the runbook for the
            # one that has bitten twice. "Invalid API key" from Supabase is not
            # a catalogue problem at all — the task never reaches GitHub. It
            # means the operator secret's SUPABASE_SECRET_KEY is wrong, which
            # also fails the readiness probe, so the release would have stopped
            # a step later anyway.
            if printf '%s' "$LINES" | grep -qi "invalid api key"; then
              echo "::error::Supabase rejected the task's credentials. This is the operator secret, not the catalogue: see docs/runbooks/database-unreachable.md section 2."
            fi
            echo "::error::The catalogue sync exited $EXIT. Its output is above; the stream is /ecs/$NAME_PREFIX-backend $STREAM"
            exit 1
          else
            SYNCED="synced"
          fi
          echo "catalogue=$SYNCED" >> "$GITHUB_OUTPUT"

      # Rolling update: the service keeps 100% healthy while the new tasks
      # come up (deployment_minimum_healthy_percent = 100). If they never do,
      # the circuit breaker rolls back and `wait` fails — that is the alarm.
      - name: Roll the service
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$NAME_PREFIX" --service "$NAME_PREFIX-backend" \
            --task-definition "${{ steps.register.outputs.arn }}" >/dev/null
          aws ecs wait services-stable --cluster "$NAME_PREFIX" --services "$NAME_PREFIX-backend"
          LIVE=$(aws ecs describe-services --cluster "$NAME_PREFIX" --services "$NAME_PREFIX-backend" --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition' --output text)
          if [ "$LIVE" != "${{ steps.register.outputs.arn }}" ]; then
            echo "::error::The service settled on $LIVE, not the new revision — the circuit breaker rolled back. See docs/runbooks/deploy-rolled-back.md."
            exit 1
          fi

      # The health gate the load balancer deliberately does not apply: /ready
      # proves the new tasks can reach Supabase and S3, through the real edge.
      - name: Readiness through the edge
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${{ vars.APP_URL }}/api/ready" || true)
            if [ "$code" = "200" ]; then echo "/api/ready: $code"; exit 0; fi
            echo "attempt $i: /api/ready returned $code"; sleep 10
          done
          echo "::error::/api/ready did not return 200 within three minutes. See docs/runbooks/database-unreachable.md and storage-failure.md."
          exit 1

  # ---------------------------------------------------------------------------
  frontend:
    name: Deploy the frontend
    needs: [config, gate, backend]
    # As `backend` above: the skipped `build-dbtools` is still an ancestor
    # here, so this job has to state its own requirement too.
    if: ${{ !cancelled() && needs.config.result == 'success' && needs.gate.result == 'success' && needs.backend.result == 'success' }}
    runs-on: ubuntu-latest
      # As the backend job above.
    timeout-minutes: 30
    environment: production
    env:
      ECR_REGISTRY: ${{ needs.config.outputs.ecr_registry }}
    outputs:
      revision: ${{ steps.register.outputs.revision }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Register the task definition revision
        id: register
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$NAME_PREFIX-frontend:${{ needs.gate.outputs.sha }}"
          aws ecs describe-task-definition --task-definition "$NAME_PREFIX-frontend" --include TAGS > /tmp/current.json
          jq --arg image "$IMAGE" '
            .taskDefinition
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
            | .containerDefinitions[0].image = $image
          ' /tmp/current.json > /tmp/next.json
          jq '.tags // []' /tmp/current.json > /tmp/tags.json
          ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/next.json --tags file:///tmp/tags.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "revision=${ARN##*:}" >> "$GITHUB_OUTPUT"

      - name: Roll the service
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$NAME_PREFIX" --service "$NAME_PREFIX-frontend" \
            --task-definition "${{ steps.register.outputs.arn }}" >/dev/null
          aws ecs wait services-stable --cluster "$NAME_PREFIX" --services "$NAME_PREFIX-frontend"
          LIVE=$(aws ecs describe-services --cluster "$NAME_PREFIX" --services "$NAME_PREFIX-frontend" --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition' --output text)
          if [ "$LIVE" != "${{ steps.register.outputs.arn }}" ]; then
            echo "::error::The service settled on $LIVE, not the new revision — the circuit breaker rolled back. See docs/runbooks/deploy-rolled-back.md."
            exit 1
          fi

      - name: The site answers through the edge
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${{ vars.APP_URL }}/" || true)
            case "$code" in 2*|3*) echo "/: $code"; exit 0;; esac
            echo "attempt $i: / returned $code"; sleep 10
          done
          echo "::error::The home page did not answer within two minutes. See docs/runbooks/site-down.md."
          exit 1

  # ---------------------------------------------------------------------------
  summary:
    name: Record the release
    needs: [config, gate, backend, frontend]
    # As the two above. The release record is what rollback.yml reads the
    # revisions from, so a silently skipped summary costs the way back.
    if: ${{ !cancelled() && needs.config.result == 'success' && needs.gate.result == 'success' && needs.backend.result == 'success' && needs.frontend.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          {
            echo "## Released ${{ needs.gate.outputs.short_sha }}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| commit | \`${{ needs.gate.outputs.sha }}\` |"
            echo "| tag | \`${{ needs.gate.outputs.tag }}\` |"
            echo "| backend task definition | \`legalworkflows-production-backend:${{ needs.backend.outputs.revision }}\` |"
            echo "| frontend task definition | \`legalworkflows-production-frontend:${{ needs.frontend.outputs.revision }}\` |"
            echo "| workflow catalogue | ${{ needs.backend.outputs.catalogue }} |"
            echo "| source | https://github.com/${{ needs.config.outputs.mirror_repository }}/tree/${{ needs.gate.outputs.sha }} |"
            echo
            echo "To undo: run the Rollback workflow with the revisions from the release before this one."
          } >> "$GITHUB_STEP_SUMMARY"
