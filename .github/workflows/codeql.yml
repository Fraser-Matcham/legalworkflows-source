# CodeQL: static analysis for the whole tree (backend/ + frontend/).
#
# Both halves are interpreted TypeScript, so CodeQL's `build-mode: none`
# extracts them straight from source — no npm ci, no build step, and no
# autobuild guessing at the two-package layout. One analyze job covers
# backend and frontend together. The weekly cron re-runs analysis on an
# otherwise-quiet tree so newly shipped CodeQL queries still get applied.
# Findings land in the Security tab (code scanning), not as CI noise.
name: CodeQL

# DISABLED — ticket 2022. Re-enable by deleting the four comment markers below.
#
# Not a code problem, and not a defect in this workflow. The analysis itself is
# healthy: with `actions: read` granted (see the permissions block), CodeQL
# checks out, builds the database and runs the full javascript-typescript
# analysis. It then fails at the very last step, publishing the results:
#
#   ##[error]Please verify that the necessary features are enabled: Code
#   Security must be enabled for this repository to use code scanning.
#   CodeQL job status was configuration error.
#
# Code scanning on a PRIVATE repository requires GitHub Code Security to be
# enabled for it, which on this organisation's plan is a paid add-on. There is
# nowhere to publish the findings, so every run is a configuration error — on
# every pull request and every push to main, forever, until that setting
# changes. A default branch that is red for a reason no commit can fix teaches
# people to ignore red, which costs more than the analysis is worth while it
# cannot run.
#
# Disabled rather than deleted, unlike scorecard.yml: Scorecard can never work
# on a private repository, whereas this one starts working the moment Code
# Security is switched on under Settings > Advanced Security. At that point
# uncomment the triggers below and the workflow resumes with no other change.
#
# `workflow_dispatch` is deliberately left live so the entitlement can be
# retested on demand without editing this file.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  # schedule:
  #   # Mondays 04:30 UTC.
  #   - cron: "30 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to upload results to code scanning.
      security-events: write
      # Required on a PRIVATE repository. When analysing a pull request the
      # action uses overlay database mode and looks up the base database from a
      # previous workflow run, which is an Actions REST call. On a public repo
      # the default token can already read that; here it cannot, and init fails
      # with "Resource not accessible by integration" before producing any
      # database. Least privilege still holds — read, not write.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:javascript-typescript"
