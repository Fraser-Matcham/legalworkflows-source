# CI: build and test.
#
# Adapted from the amal66/mike fork's .github/workflows/ci.yml (monorepo
# layout) to this repository's backend/ + frontend/ layout. Test steps use
# `npm test --if-present`, and the eval job checks for evals/run.mjs, so this
# workflow is safe to merge before or after the test-harness and evals PRs:
# on a tree without those pieces the test steps no-op and the build still
# gates the merge. Beyond the fork version this also builds the frontend
# (placeholder NEXT_PUBLIC_* env — verified sufficient for `next build`) and
# runs eslint as a blocking gate (the error backlog is at zero).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Git's line-level merge can splice both sides of package(-lock).json
      # into invalid JSON without a conflict (bit PR #233). npm's own error
      # for an unparseable lockfile is the misleading "npm ci can only
      # install with an existing package-lock.json" — fail fast with the real
      # reason instead.
      - name: Validate package.json and lockfile parse
        run: node -e "for (const f of ['package.json','package-lock.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"

      - run: npm ci

      # Runs the suite with the coverage-ratchet floor check (see
      # docs/testing-coverage.md). This job ran plain `npm test` until the
      # floors were raised to the measured numbers: the thresholds in
      # vitest.config.mts were therefore never evaluated in CI, so a coverage
      # drop could not fail anything. `test:coverage` runs the same suite and
      # adds the floor check; --if-present keeps the original no-op semantics
      # for a tree without the script.
      - run: npm run test:coverage --if-present

      - run: npm run build

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same silent-merge-corruption guard as the backend job.
      - name: Validate package.json and lockfile parse
        run: node -e "for (const f of ['package.json','package-lock.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"

      - run: npm ci

      # Runs the suite with the coverage-ratchet floor check (see
      # docs/frontend-testing.md); --if-present keeps the fallback semantics,
      # so a tree without the "test:coverage" script still no-ops.
      - run: npm run test:coverage --if-present

      # Blocking gate: the eslint error backlog was burned down in this PR
      # (0 errors; warnings do not fail the step), so any new error fails CI.
      - run: npm run lint

      # Production build. Runtime-only server configuration is intentionally
      # not required for this compile-time check.
      # This catches type errors (next build runs tsc) and broken routes/imports.
      - run: npm run build

  # -----------------------------------------------------------------------
  # Offline eval harness: deterministic scorecard for citation accuracy,
  # prompt-injection resistance, and privilege/PII leakage. Runs against
  # committed fixtures (no network, no LLM calls, no secrets), so it is cheap
  # enough to gate every PR. --threshold 1.0 = every case must pass.
  # Skips gracefully until the evals PR merges.
  # -----------------------------------------------------------------------
  boundary:
    name: Repository boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # A gate rather than a review convention because the failure is
      # irreversible. AGPL section 5(c) applies this repository's terms to the
      # combined work once the parts are linked; Juralio is Apache-2.0, and
      # reverting the commit does not withdraw the grant already made to
      # whoever received the combined work.
      #
      # Run the self-test first: it builds a tree containing one of each
      # violation and fails if any goes undetected, so a checker that has
      # silently stopped detecting anything cannot pass as a clean repository.
      - run: npm run boundary:self-test

      - run: npm run boundary

  tenancy:
    name: Route tenancy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # createServerSupabase() holds the service role key, so row-level
      # security does not apply and each handler is the only thing scoping its
      # own queries. This flags handlers that query the database and never use
      # the caller's identity at all — the whole-handler omission. It cannot
      # tell whether an identity that IS used reaches the right query; the
      # cross-tenant denial tests cover that.
      - run: npm run tenancy:self-test

      - run: npm run tenancy

  trademarks:
    name: Trademarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Neither licence grants the upstream marks: AGPL section 7(e) and
      # Apache-2.0 section 6 both reserve them. This sweeps the surfaces a
      # person or a link preview can see and fails on an upstream name,
      # wordmark or domain that is not accounted for.
      #
      # It is an allowlist rather than a ban because AGPL 5(a) and 5(b)
      # REQUIRE naming the original work, so the attribution in
      # legalNotice.ts must survive the sweep. Entries print on every run,
      # which is how the references the operator chose to defer stay visible
      # instead of quietly becoming permanent.
      - run: npm run trademarks:self-test

      - run: npm run trademarks

  schema-privileges:
    name: Schema privileges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The backend reads client data as the Supabase service role, so every
      # table is taken away from anon and authenticated to stop PostgREST —
      # reachable by anyone holding the publishable key — serving a row at
      # all. A table added without its revoke line is invisible to every
      # other check: the backend still works, so no test notices.
      #
      # The schema-drift workflow cannot cover this either, and not for the
      # obvious reason: it does use a real Supabase database. But it resets
      # each path with `drop schema public cascade`, which discards the
      # pg_default_acl entries that would otherwise hand a newly created
      # table to anon and authenticated. So a missing revoke is a no-op on
      # both sides, the fingerprints agree, and the check passes while a real
      # project stays exposed. This reads the file instead.
      - run: npm run schema-privileges:self-test

      - run: npm run schema-privileges

  frontend-boundary:
    name: Frontend boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The frontend used to type-import from backend/src. Two erased
      # `import type` lines, and they were the reason frontend/Dockerfile had
      # to take the repository root as its build context and copy the
      # backend's sources in just to typecheck — which meant the frontend
      # could not be built or deployed as a component at all.
      #
      # The types are re-declared in
      # frontend/src/app/components/shared/apiTypes.ts. This stops the import
      # coming back, the same way the Juralio boundary check does.
      - run: npm run frontend-boundary:self-test

      - run: npm run frontend-boundary

  evals:
    name: Eval harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run eval harness (skips if evals/ not present)
        run: |
          if [ -f evals/run.mjs ]; then
            node evals/run.mjs --threshold 1.0
          else
            echo "evals/run.mjs not present on this tree; skipping"
          fi
