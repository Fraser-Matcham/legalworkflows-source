# Terraform hygiene for infra/. Format and validate only — nothing here talks
# to AWS, holds credentials, or applies anything. Applying is a deliberate
# human step (infra/README.md, "Applying").
#
# A separate workflow rather than a job in ci.yml so it runs only when infra/
# changes, and so the check has a stable name to require in branch protection.
name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
      # fmt, init -backend=false and validate. Minutes, not tens of minutes.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2

      - name: Format
        run: terraform fmt -check -recursive -diff

      # -backend=false: validation needs provider schemas, not the state
      # bucket, so this runs before the account exists and without credentials.
      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color
